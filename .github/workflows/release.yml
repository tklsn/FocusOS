# Tag vX.Y.Z: builda nos três sistemas e publica no GitHub Releases (ADR 0006).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  # Cria o rascunho antes dos builds, para os três subirem na mesma release.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag igual à versão do package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão $version do package.json"
            exit 1
          fi
      - name: Rascunho da release
        run: |
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "$GITHUB_REF_NAME" $pre

  build:
    needs: draft
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec electron-builder --publish always

  # Só aqui os apps instalados passam a ver a versão; se um build falhou, fica o rascunho.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
